<!DOCTYPE html>
<html lang="zh-Hant-HK" class="booting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg?v=8">
  <link rel="stylesheet" href="../assets/css/language-nav.css">
  <link rel="stylesheet" href="assets/css/under-construction.css">
  <meta name="description" content="網站正在籌備中，敬請期待。">
  <title>網站建設中｜Chavez Poon</title>
</head>
<body data-page="zh-hk/index.html">
  <div class="boot-screen" aria-hidden="true">
    <div class="boot-console">
      <div class="boot-terminal-bar" aria-hidden="true"><span class="boot-terminal-mark">●</span> tty1 — www.chavezpoon.com / zh-hk</div>
      <div class="boot-output">
        <p class="boot-kicker">[  OK  ] GNU/LINUX :: WWW.CHAVEZPOON.COM :: 繁體中文</p>
        <div id="boot-log"></div>
        <form class="boot-consent" id="boot-consent" hidden novalidate>
          <p class="boot-consent-question" id="boot-consent-question">是否進入 www.chavezpoon.com？輸入 <kbd>y</kbd> 繼續，或輸入 <kbd>n</kbd> 關閉此分頁。</p>
          <label class="boot-consent-line" for="boot-consent-input">
            <span class="boot-prompt">chavez:~$</span>
            <input id="boot-consent-input" name="boot-choice" type="text" inputmode="text" enterkeyhint="go" maxlength="1" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="輸入 y 進入網站，或輸入 n 關閉分頁" autofocus>
          </label>
          <p class="boot-consent-feedback" id="boot-consent-feedback" aria-live="polite"></p>
        </form>
        <div class="boot-progress" id="boot-progress" hidden aria-live="polite">
          <div class="boot-progress-heading"><span>正在啟動</span><span id="boot-progress-value">0%</span></div>
          <div class="boot-progress-track" role="progressbar" aria-label="正在啟動網站" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span class="boot-progress-fill" id="boot-progress-fill"></span>
          </div>
        </div>
        <p class="boot-ready" id="boot-ready">中文網站已就緒。<span class="boot-cursor"></span></p>
      </div>
    </div>
  </div>
  <canvas class="star-field" id="particles" aria-hidden="true"></canvas>
  <main class="page construction-page">
    <section class="construction-card" aria-labelledby="page-title">
      <p class="construction-label"><span class="status-dot" aria-hidden="true"></span>繁體中文版・籌備中</p>
      <h1 id="page-title">網站建設中</h1>
      <p class="construction-copy">網站正在籌備中，敬請期待。</p>
      <a class="english-link" href="mailto:cyrillusmariae@outlook.com" target="_blank" rel="noopener noreferrer">
        電郵聯絡我 <span aria-hidden="true">↗</span>
      </a>
    </section>
    <p class="page-signature">Chavez Poon <span aria-hidden="true">·</span> Copyright © <span data-copyright-year></span></p>
  </main>
  <script src="../assets/js/client-detection.js?v=2"></script>
  <script src="assets/js/boot-terminal-sizing.js?v=3"></script>
  <script defer src="../assets/js/language-nav.js"></script>
  <script defer src="../assets/js/gallery-background.js"></script>
  <script defer src="../assets/js/site-clock.js"></script>
  <script defer src="assets/js/boot-screen.js?v=3"></script>
</body>
</html>
